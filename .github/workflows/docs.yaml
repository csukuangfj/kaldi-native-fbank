name: docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'kaldi-native-fbank/csrc/**'
      - 'kaldi-native-fbank/python/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen texlive-latex-recommended \
            texlive-fonts-recommended texlive-latex-extra latexmk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install doc dependencies
        run: |
          python3 -m pip install -U pip
          python3 -m pip install -r docs/requirements.txt

      - name: Build python module (autodoc imports it)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DKALDI_NATIVE_FBANK_BUILD_TESTS=OFF \
            -DPYTHON_EXECUTABLE=$(which python3)
          cmake --build build -j2

      - name: Build HTML (sphinx + doxygen C++ API)
        run: |
          cd docs
          make html

      - name: Build PDF
        run: |
          cd docs
          make latexpdf

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/build/latex/kaldi-native-fbank.pdf

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: docs/build/latex/kaldi-native-fbank.pdf

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html

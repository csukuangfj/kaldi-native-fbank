name: build-wheels-linux-x86

on:
  push:
    branches:
      - wheel
      - master
      - more-feat
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: build-wheels-linux-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]
        manylinux: [manylinux2014] #, manylinux_2_28]

    steps:
      - uses: actions/checkout@v4

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions

      # The manylinux2014 i686 container has no working DNS egress at all on
      # the hosted runners: every resolver probe fails inside the docker
      # bridge ("DNS FAIL: 168.63.129.16 / 8.8.8.8 / 1.1.1.1").  Run
      # cibuildwheel's containers with host networking (a docker shim injects
      # --network host) so they share the runner's working network stack, then
      # point the container at the host's resolver (systemd-resolved stub).
      # This must run before both cibuildwheel steps below.
      - name: Fix DNS inside the manylinux container
        shell: bash
        run: |
          mkdir -p "$HOME/docker-shim"
          printf '%s\n' '#!/bin/bash' \
            'if [ "$1" = "run" ] || [ "$1" = "create" ]; then' \
            '  cmd="$1"; shift' \
            '  exec /usr/bin/docker "$cmd" --network host "$@"' \
            'fi' \
            'exec /usr/bin/docker "$@"' > "$HOME/docker-shim/docker"
          chmod +x "$HOME/docker-shim/docker"
          echo "$HOME/docker-shim" >> $GITHUB_PATH
          DNS_SERVERS=$( (resolvectl dns 2>/dev/null; grep nameserver /etc/resolv.conf) \
            | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -v '^127\.' | sort -u | tr '\n' ' ')
          echo "CIBW_BEFORE_ALL=for d in 127.0.0.53 ${DNS_SERVERS}8.8.8.8 1.1.1.1; do echo \"nameserver \$d\" > /etc/resolv.conf; if getent hosts pypi.org >/dev/null 2>&1; then echo \"DNS OK: \$d\"; break; else echo \"DNS FAIL: \$d\"; fi; done" >> $GITHUB_ENV
          echo "CIBW_ENVIRONMENT=PIP_RETRIES=10 PIP_TIMEOUT=60" >> $GITHUB_ENV

      # CPython 3.8 is EOL and has been dropped upstream: the manylinux images
      # removed the interpreter on 2026-05-07 and cibuildwheel 4.0 removed
      # support for building it. The last combination that still works is
      # cibuildwheel 3.x plus a pinned image from before that drop.
      - name: Build wheels (cp38)
        if: matrix.python-version == 'cp38'
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* cp36-* cp37-* *-win32 pp* *-musllinux*"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_ARCHS: "i686"
          CIBW_MANYLINUX_I686_IMAGE: quay.io/pypa/${{ matrix.manylinux }}_i686:2026.05.07-1

      - name: Build wheels
        if: matrix.python-version != 'cp38'
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* cp36-* cp37-* *-win32 pp* *-musllinux*"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_ARCHS: "i686"
          CIBW_MANYLINUX_I686_IMAGE: quay.io/pypa/${{ matrix.manylinux }}_i686:2026.05.07-1

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          twine upload --skip-existing ./wheelhouse/*.whl

      - name: Build sdist
        if: ${{ matrix.python-version == 'cp38' }}
        shell: bash
        run: |
          python3 setup.py sdist
          ls -l dist/*

      - name: Publish sdist to PyPI
        if: ${{ matrix.python-version == 'cp38' }}
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload --skip-existing dist/*.tar.gz
